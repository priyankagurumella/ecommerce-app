<!DOCTYPE html>
<html>
<head>
    <title>E-Commerce Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Login/Register Section -->
    <div id="auth-section">
        <h1>E-Commerce Store</h1>

        <div class="auth-box">
            <h2>Register / Login</h2>

            <input type="text" id="username" placeholder="Enter Username">
            <input type="email" id="email" placeholder="Enter Email">
            <input type="password" id="password" placeholder="Enter Password">

            <select id="role">
                <option value="User">User</option>
                <option value="Admin">Admin</option>
            </select>

            <button onclick="register()">Register</button>
            <button onclick="login()">Login</button>
        </div>
    </div>

    <!-- Store Section -->
    <div id="store-section" style="display:none;">
        <h1>E-Commerce Store</h1>

        <h2 id="welcome-role"></h2>

        <div class="container">

            <div class="product">
                <h3>Headphones</h3>
                <p>Price: ₹1999</p>
                <button onclick="addToCart('Headphones',1999)">Add to Cart</button>
            </div>

            <div class="product">
                <h3>Smart Watch</h3>
                <p>Price: ₹2999</p>
                <button onclick="addToCart('Smart Watch',2999)">Add to Cart</button>
            </div>

            <div class="product">
                <h3>Mobile Phone</h3>
                <p>Price: ₹14999</p>
                <button onclick="addToCart('Mobile Phone',14999)">Add to Cart</button>
            </div>

        </div>

        <!-- Cart -->
        <div class="cart">
            <h2>Cart</h2>
            <ul id="cart-items"></ul>
            <h3 id="total-price">Total: ₹0</h3>
            <button onclick="checkout()">Checkout</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
